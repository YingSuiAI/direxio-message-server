# E2E-only overlay. The ordinary local Compose file keeps its historical
# password environment fallback; this overlay switches the Message Server
# PostgreSQL to a protected file reference without changing that baseline.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/message_postgres_password
    secrets:
      - message_postgres_password

  message-server-init:
    build: !reset null
    secrets:
      - message_postgres_pgpass
    environment:
      PGPASSFILE: /run/secrets/message_postgres_pgpass
    command:
      - |
        set -eu
        mkdir -p /etc/dirextalk-message-server /var/dirextalk-message-server
        if [ ! -f /etc/dirextalk-message-server/matrix_key.pem ]; then
          /usr/bin/generate-keys -private-key /etc/dirextalk-message-server/matrix_key.pem
        fi
        if [ ! -f /etc/dirextalk-message-server/server.crt ] || [ ! -f /etc/dirextalk-message-server/server.key ]; then
          /usr/bin/generate-keys \
            -tls-cert /etc/dirextalk-message-server/server.crt \
            -tls-key /etc/dirextalk-message-server/server.key \
            -server "${MESSAGE_SERVER_NAME:-localhost}"
        fi
        if [ ! -f /etc/dirextalk-message-server/message-server.yaml ]; then
          /usr/bin/generate-config \
            -dir /var/dirextalk-message-server \
            -db "postgres://${DIREXTALK_MESSAGE_POSTGRES_USER:-dirextalk_message_server}@postgres/${DIREXTALK_MESSAGE_POSTGRES_DB:-dirextalk_message_server}?sslmode=disable" \
            -server "${MESSAGE_SERVER_NAME:-localhost}" \
            > /etc/dirextalk-message-server/message-server.yaml
        fi
        sed -i 's|well_known_client_name: .*|well_known_client_name: "'"${MESSAGE_CLIENT_BASE_URL:-http://localhost:8008}"'"|' /etc/dirextalk-message-server/message-server.yaml

  message-server:
    build: !reset null
    secrets:
      - message_postgres_pgpass
    environment:
      PGPASSFILE: /run/secrets/message_postgres_pgpass

secrets:
  message_postgres_password:
    file: ${DIREXTALK_MESSAGE_POSTGRES_PASSWORD_FILE:?set the E2E Message Server PostgreSQL password file}
  message_postgres_pgpass:
    file: ${DIREXTALK_MESSAGE_POSTGRES_PGPASS_FILE:?set the E2E Message Server PostgreSQL pgpass file}
