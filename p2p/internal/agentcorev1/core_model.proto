syntax = "proto3";

package dirextalk.agent.v1;

option go_package = "github.com/YingSuiAI/dirextalk-agent/api/gen/dirextalk/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

enum CoreModelProvider {
  CORE_MODEL_PROVIDER_UNSPECIFIED = 0;
  CORE_MODEL_PROVIDER_OPENAI_COMPATIBLE = 1;
  CORE_MODEL_PROVIDER_ANTHROPIC = 2;
  CORE_MODEL_PROVIDER_GEMINI = 3;
}

message CoreSamplingUpdate {
  oneof value {
    google.protobuf.Empty preserve = 1;
    double set = 2;
    bool clear = 3;
  }
}

message CoreModelProfile {
  string profile_id = 1;
  string display_name = 2;
  CoreModelProvider provider = 3;
  string base_url = 4;
  string model = 5;
  string system_prompt = 6;
  bool api_key_configured = 7;
  optional double temperature = 8;
  optional double top_p = 9;
  int32 max_output_tokens = 10;
  int32 context_window = 11;
  string reasoning_effort = 12;
  int64 revision = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  string client_profile_id = 16;
}

message CoreModelProfileSyncEntry {
  string client_profile_id = 1;
  optional int64 expected_revision = 2;
  string display_name = 3;
  CoreModelProvider provider = 4;
  string base_url = 5;
  string model = 6;
  string system_prompt = 7;
  optional string api_key = 8;
  optional double temperature = 9;
  optional double top_p = 10;
  int32 max_output_tokens = 11;
  int32 context_window = 12;
  string reasoning_effort = 13;
}

message ModelProfileServiceCreateRequest {
  string idempotency_key = 1;
  string display_name = 2;
  CoreModelProvider provider = 3;
  string base_url = 4;
  string model = 5;
  string system_prompt = 6;
  string api_key = 7;
  optional double temperature = 8;
  optional double top_p = 9;
  int32 max_output_tokens = 10;
  int32 context_window = 11;
  string reasoning_effort = 12;
}
message ModelProfileServiceCreateResponse { CoreModelProfile profile = 1; }

message ModelProfileServiceGetRequest { string profile_id = 1; }
message ModelProfileServiceGetResponse { CoreModelProfile profile = 1; }

message ModelProfileServiceListRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ModelProfileServiceListResponse {
  repeated CoreModelProfile profiles = 1;
  string next_page_token = 2;
}

message ModelProfileServiceUpdateRequest {
  string idempotency_key = 1;
  string profile_id = 2;
  int64 expected_revision = 3;
  optional string display_name = 4;
  optional CoreModelProvider provider = 5;
  optional string base_url = 6;
  optional string model = 7;
  optional string system_prompt = 8;
  oneof api_key_update {
    string replacement_api_key = 9;
    bool clear_api_key = 10;
  }
  CoreSamplingUpdate temperature = 11;
  CoreSamplingUpdate top_p = 12;
  optional int32 max_output_tokens = 13;
  optional int32 context_window = 14;
  optional string reasoning_effort = 15;
}
message ModelProfileServiceUpdateResponse { CoreModelProfile profile = 1; }

message ModelProfileServiceDeleteRequest {
  string idempotency_key = 1;
  string profile_id = 2;
  int64 expected_revision = 3;
}
message ModelProfileServiceDeleteResponse {}

message ModelProfileServiceTestConnectionRequest {
  string idempotency_key = 1;
  string profile_id = 2;
}
message ModelProfileServiceTestConnectionResponse {
  bool reachable = 1;
  string error_code = 2;
}

message ModelProfileServiceSyncRequest {
  string idempotency_key = 1;
  string default_client_profile_id = 2;
  repeated CoreModelProfileSyncEntry entries = 3;
}
message ModelProfileServiceSyncResponse {
  repeated CoreModelProfile profiles = 1;
  string default_client_profile_id = 2;
}

service ModelProfileService {
  rpc Create(ModelProfileServiceCreateRequest) returns (ModelProfileServiceCreateResponse);
  rpc Get(ModelProfileServiceGetRequest) returns (ModelProfileServiceGetResponse);
  rpc List(ModelProfileServiceListRequest) returns (ModelProfileServiceListResponse);
  rpc Update(ModelProfileServiceUpdateRequest) returns (ModelProfileServiceUpdateResponse);
  rpc Delete(ModelProfileServiceDeleteRequest) returns (ModelProfileServiceDeleteResponse);
  rpc TestConnection(ModelProfileServiceTestConnectionRequest) returns (ModelProfileServiceTestConnectionResponse);
  rpc Sync(ModelProfileServiceSyncRequest) returns (ModelProfileServiceSyncResponse);
}
