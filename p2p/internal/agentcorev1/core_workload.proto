syntax = "proto3";

package dirextalk.agent.v1;

option go_package = "github.com/YingSuiAI/dirextalk-agent/api/gen/dirextalk/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";
import "dirextalk/agent/v1/core_confirmation.proto";

enum CoreWorkloadTargetKind {
  CORE_WORKLOAD_TARGET_KIND_UNSPECIFIED = 0;
  CORE_WORKLOAD_TARGET_KIND_CORE_RUNNER = 1;
  CORE_WORKLOAD_TARGET_KIND_AWS_EC2_SSM = 2;
  CORE_WORKLOAD_TARGET_KIND_AWS_ECS = 3;
}
enum CoreWorkloadOperationKind {
  CORE_WORKLOAD_OPERATION_KIND_UNSPECIFIED = 0;
  CORE_WORKLOAD_OPERATION_KIND_APPLY = 1;
  CORE_WORKLOAD_OPERATION_KIND_DESTROY = 2;
}
enum CoreWorkloadSecretPurpose {
  CORE_WORKLOAD_SECRET_PURPOSE_UNSPECIFIED = 0;
  CORE_WORKLOAD_SECRET_PURPOSE_MODEL_API_KEY = 1;
  CORE_WORKLOAD_SECRET_PURPOSE_MCP_CREDENTIAL = 2;
  CORE_WORKLOAD_SECRET_PURPOSE_SKILL_SECRET = 3;
  CORE_WORKLOAD_SECRET_PURPOSE_AWS_CREDENTIAL = 4;
  CORE_WORKLOAD_SECRET_PURPOSE_OTHER_EXTENSION_SECRET = 5;
}
message CoreWorkloadTargetIdentity {
  CoreWorkloadTargetKind kind = 1;
  string core_runner_service = 2;
  string image_digest = 3;
  string aws_account_id = 4;
  string aws_region = 5;
  string instance_id = 6;
  string cluster = 7;
  string service = 8;
  string task_definition_revision = 9;
  int64 desired_count = 10;
	string endpoint = 11;
	string core_runner_id = 12;
	// Typed AWS EC2/SSM target facts.  These fields are intentionally explicit
	// so providers never receive an arbitrary SDK payload.
	string aws_ec2_document_version = 13;
	string aws_ec2_systemd_service = 14;
	map<string,string> aws_ec2_required_instance_tags = 15;
	// Typed AWS ECS/Fargate target facts.
	string aws_ecs_cluster_arn = 16;
	string aws_ecs_service_name = 17;
	string aws_ecs_task_family = 18;
	string aws_ecs_platform_version = 19;
	repeated string aws_ecs_subnet_ids = 20;
	repeated string aws_ecs_security_group_ids = 21;
	bool aws_ecs_assign_public_ip = 22;
	string aws_ecs_target_group_arn = 23;
	uint32 aws_ecs_target_group_port = 24;
	string aws_ecs_task_role_arn = 25;
	string aws_ecs_execution_role_arn = 26;
	int64 aws_ecs_desired_count = 27;
	string aws_ecs_image_uri = 28;
}
message CoreWorkloadResourceLimits {
  int64 cpu = 1;
  int64 memory_mb = 2;
  int64 processes = 3;
  int64 disk_mb = 4;
  int64 timeout_seconds = 5;
  int64 output_mb = 6;
}
message CoreWorkloadPort { uint32 port = 1; }
message CoreWorkloadNetworkGrant { string reference_id = 1; string kind = 2; }
message CoreWorkloadSecretGrantRef {
  string reference_id = 1;
  CoreWorkloadSecretPurpose purpose = 2;
  string binding_digest = 3;
}
message CoreWorkloadTargetSettings {
  CoreWorkloadTargetIdentity identity = 1;
  repeated CoreWorkloadPort ports = 2;
  repeated CoreWorkloadNetworkGrant network_grants = 3;
  map<string,string> labels = 4;
}
message CoreWorkloadActualSnapshot {
  string workload_id = 1;
  uint64 revision = 2;
  string state = 3;
  CoreWorkloadTargetIdentity identity = 4;
  string applied_plan_id = 5;
  string applied_plan_digest = 6;
  string readback_digest = 7;
  string provider_version = 8;
  google.protobuf.Timestamp observed_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}
message CoreWorkloadOperationPlan {
  string plan_id = 1;
  uint64 plan_revision = 2;
  string plan_digest = 3;
  CoreWorkloadTargetSettings target = 4;
  CoreWorkloadResourceLimits resource_limits = 5;
  repeated CoreWorkloadSecretGrantRef secret_grants = 6;
}
message CoreWorkloadPlan {
  string plan_id = 1;
  int64 revision = 2;
  string digest = 3;
  string summary = 4;
  string artifact = 5;
  string source = 6;
  repeated string command_steps = 7;
	string image_digest = 8;
	string image_uri = 19;
  CoreWorkloadTargetKind target_kind = 9;
  google.protobuf.Timestamp expires_at = 14;
  google.protobuf.Timestamp created_at = 15;
  CoreWorkloadTargetSettings typed_target = 16;
  CoreWorkloadResourceLimits typed_resource_limits = 17;
  repeated CoreWorkloadSecretGrantRef typed_secret_grants = 18;
}
message CoreWorkloadOperation {
  string operation_id = 1;
  string workload_id = 2;
  string plan_id = 3;
  CoreWorkloadOperationKind kind = 4;
  int64 plan_revision = 5;
  string plan_digest = 6;
  CoreWorkloadTargetKind target_kind = 7;
  string task_id = 8;
  string confirmation_id = 9;
  string status = 10;
  int64 revision = 11;
  string failure_code = 12;
  string failure_summary = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  CoreWorkloadOperationPlan desired_plan = 16;
  CoreWorkloadActualSnapshot actual = 17;
  string dispatch_claim = 18;
  uint64 dispatch_epoch = 19;
  google.protobuf.Timestamp dispatch_lease_until = 20;
}
message CoreWorkloadEvent {
  string operation_id = 1;
  int64 sequence = 2;
  string kind = 3;
  string status = 4;
  string message = 5;
  CoreWorkloadActualSnapshot actual = 6;
  google.protobuf.Timestamp at = 7;
}
message WorkloadServicePlanRequest {
  string idempotency_key = 1;
  string summary = 2;
  string artifact = 3;
  string source = 4;
  repeated string command_steps = 5;
	string image_digest = 6;
	string image_uri = 16;
  CoreWorkloadTargetKind target_kind = 7;
  google.protobuf.Timestamp expires_at = 12;
  CoreWorkloadTargetSettings typed_target = 13;
  CoreWorkloadResourceLimits typed_resource_limits = 14;
  repeated CoreWorkloadSecretGrantRef typed_secret_grants = 15;
}
message WorkloadServicePlanResponse { CoreWorkloadPlan plan = 1; }
message WorkloadServiceGetRequest { string plan_id = 1; }
message WorkloadServiceGetResponse { CoreWorkloadPlan plan = 1; }
message WorkloadServiceListRequest { int32 page_size = 1; string page_token = 2; }
message WorkloadServiceListResponse { repeated CoreWorkloadPlan plans = 1; string next_page_token = 2; }
message WorkloadServiceQuoteRequest { string plan_id = 1; }
message CoreWorkloadQuote { string plan_id = 1; string plan_digest = 2; string summary = 3; }
message WorkloadServiceQuoteResponse { CoreWorkloadQuote quote = 1; }
message WorkloadServiceRequestApplyRequest { string idempotency_key = 1; string plan_id = 2; string workload_id = 3; }
message WorkloadServiceRequestApplyResponse { CoreWorkloadOperation operation = 1; CoreConfirmation confirmation = 2; string task_id = 3; }
message WorkloadServiceRequestDestroyRequest { string idempotency_key = 1; string plan_id = 2; string workload_id = 3; }
message WorkloadServiceRequestDestroyResponse { CoreWorkloadOperation operation = 1; CoreConfirmation confirmation = 2; string task_id = 3; }
message WorkloadServiceGetWorkloadRequest { string workload_id = 1; }
message WorkloadServiceGetWorkloadResponse { CoreWorkloadActualSnapshot workload = 1; }
message WorkloadServiceListWorkloadsRequest { int32 page_size = 1; string page_token = 2; }
message WorkloadServiceListWorkloadsResponse { repeated CoreWorkloadActualSnapshot workloads = 1; string next_page_token = 2; }
message WorkloadServiceGetOperationRequest { string operation_id = 1; }
message WorkloadServiceGetOperationResponse { CoreWorkloadOperation operation = 1; }
message WorkloadServiceListEventsRequest { string operation_id = 1; uint64 after_sequence = 2; }
message WorkloadServiceListEventsResponse { repeated CoreWorkloadEvent events = 1; }
message WorkloadServiceCancelRequest { string idempotency_key = 1; string operation_id = 2; int64 expected_revision = 3; }
message WorkloadServiceCancelResponse { CoreWorkloadOperation operation = 1; CoreConfirmation confirmation = 2; string task_id = 3; }

service WorkloadService {
  rpc Plan(WorkloadServicePlanRequest) returns (WorkloadServicePlanResponse);
  rpc Get(WorkloadServiceGetRequest) returns (WorkloadServiceGetResponse);
  rpc List(WorkloadServiceListRequest) returns (WorkloadServiceListResponse);
  rpc Quote(WorkloadServiceQuoteRequest) returns (WorkloadServiceQuoteResponse);
  rpc RequestApply(WorkloadServiceRequestApplyRequest) returns (WorkloadServiceRequestApplyResponse);
  rpc RequestDestroy(WorkloadServiceRequestDestroyRequest) returns (WorkloadServiceRequestDestroyResponse);
  rpc GetWorkload(WorkloadServiceGetWorkloadRequest) returns (WorkloadServiceGetWorkloadResponse);
  rpc ListWorkloads(WorkloadServiceListWorkloadsRequest) returns (WorkloadServiceListWorkloadsResponse);
  rpc GetOperation(WorkloadServiceGetOperationRequest) returns (WorkloadServiceGetOperationResponse);
  rpc ListEvents(WorkloadServiceListEventsRequest) returns (WorkloadServiceListEventsResponse);
  rpc Cancel(WorkloadServiceCancelRequest) returns (WorkloadServiceCancelResponse);
}
