syntax = "proto3";
package dirextalk.agent.v1;
option go_package = "github.com/YingSuiAI/dirextalk-agent/api/gen/dirextalk/agent/v1;agentv1";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

enum CoreExtensionKind { CORE_EXTENSION_KIND_UNSPECIFIED = 0; CORE_EXTENSION_KIND_MCP = 1; CORE_EXTENSION_KIND_SKILL = 2; }
enum CoreExtensionSource { CORE_EXTENSION_SOURCE_UNSPECIFIED = 0; CORE_EXTENSION_SOURCE_OFFICIAL_REGISTRY = 1; CORE_EXTENSION_SOURCE_SMITHERY = 2; CORE_EXTENSION_SOURCE_GLAMA = 3; CORE_EXTENSION_SOURCE_GITHUB = 4; CORE_EXTENSION_SOURCE_SKILLS_SH = 5; }
enum CoreExtensionTransport { CORE_EXTENSION_TRANSPORT_UNSPECIFIED = 0; CORE_EXTENSION_TRANSPORT_STDIO_STATIC = 1; CORE_EXTENSION_TRANSPORT_STREAMABLE_HTTP = 2; CORE_EXTENSION_TRANSPORT_SKILL_STATIC = 3; }
enum CoreExtensionState { CORE_EXTENSION_STATE_UNSPECIFIED = 0; CORE_EXTENSION_STATE_DRAFT = 1; CORE_EXTENSION_STATE_INSTALLING = 2; CORE_EXTENSION_STATE_INSTALLED = 3; CORE_EXTENSION_STATE_UPDATING = 4; CORE_EXTENSION_STATE_UNINSTALLING = 5; CORE_EXTENSION_STATE_REMOVED = 6; CORE_EXTENSION_STATE_FAILED = 7; }
enum CoreSecretPurpose { CORE_SECRET_PURPOSE_UNSPECIFIED = 0; CORE_SECRET_PURPOSE_MCP_CREDENTIAL = 1; CORE_SECRET_PURPOSE_SKILL_SECRET = 2; }

message CoreSourcePin { string registry_version = 1; string registry_sha256 = 2; string git_commit = 3; string git_sha256 = 4; }
message CoreStaticEntry { string relative_path = 1; string digest = 2; repeated string argv = 3; }
message CoreRemoteEndpoint { string url = 1; string credential_reference_id = 2; }
message CoreSkillEntry { string relative_path = 1; string digest = 2; bool executable = 3; repeated string argv = 4; }
message CoreExtensionSecretGrantDescriptor { string reference_id = 1; CoreSecretPurpose purpose = 2; string binding_digest = 3; bool configured = 4; }
message CoreExecution { oneof descriptor { CoreStaticEntry stdio = 1; CoreRemoteEndpoint remote = 2; CoreSkillEntry skill = 3; } }
message CoreNetworkGrant { string scheme = 1; string host = 2; uint32 port = 3; string path_prefix = 4; string digest = 5; }

message CoreExtensionCandidate { string id = 1; CoreExtensionKind kind = 2; CoreExtensionSource source = 3; string name = 4; string description = 5; CoreSourcePin pin = 6; CoreExtensionTransport transport = 7; }
message CoreExtensionInspection { CoreExtensionCandidate candidate = 1; string content_digest = 2; string manifest_digest = 3; string execution_digest = 4; string network_schema_digest = 5; string secret_schema_digest = 6; CoreExecution execution = 7; repeated CoreNetworkGrant network_grants = 8; repeated CoreExtensionSecretGrantDescriptor secret_grants = 9; }
message CoreExtensionVersion { string version_id = 1; CoreSourcePin pin = 2; string content_digest = 3; string manifest_digest = 4; string execution_digest = 5; string network_schema_digest = 6; string secret_schema_digest = 7; CoreExecution execution = 8; google.protobuf.Timestamp created_at = 9; repeated CoreNetworkGrant network_grants = 10; repeated CoreExtensionSecretGrantDescriptor secret_grants = 11; }
message CoreInstallation { string installation_id = 1; CoreExtensionKind kind = 2; CoreExtensionSource source = 3; string name = 4; int64 revision = 5; CoreExtensionState state = 6; string active_version_id = 7; repeated CoreExtensionVersion versions = 8; repeated CoreExtensionSecretGrantDescriptor secret_grants = 9; google.protobuf.Timestamp created_at = 10; google.protobuf.Timestamp updated_at = 11; string proposed_version_id = 12; string candidate_id = 13; string description = 14; CoreExtensionTransport transport = 15; repeated CoreNetworkGrant network_grants = 16; }

message CoreExtensionSecretInput { string reference_id = 1; CoreSecretPurpose purpose = 2; string secret_value = 3; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExtensionSearchRequest { CoreExtensionKind kind = 1; CoreExtensionSource source = 2; string text = 3; int32 page_size = 4; string page_token = 5; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExtensionSearchResponse { repeated CoreExtensionCandidate candidates = 1; string next_page_token = 2; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExtensionInspectRequest { CoreExtensionKind kind = 1; CoreExtensionSource source = 2; string id = 3; CoreSourcePin pin = 4; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExtensionInspectResponse { CoreExtensionInspection inspection = 1; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExtensionMutationRequest { string idempotency_key = 1; string installation_id = 2; int64 expected_revision = 3; CoreExtensionCandidate candidate = 4; CoreExtensionInspection inspection = 5; repeated CoreExtensionSecretInput secret_inputs = 6; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExtensionMutationResponse { CoreInstallation installation = 1; string confirmation_id = 2; string task_id = 3; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExtensionGetRequest { string installation_id = 1; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExtensionGetResponse { CoreInstallation installation = 1; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExtensionListRequest { CoreExtensionKind kind = 1; CoreExtensionSource source = 2; CoreExtensionState state = 3; int32 page_size = 4; string page_token = 5; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExtensionListResponse { repeated CoreInstallation installations = 1; string next_page_token = 2; }
message CoreTool { string name = 1; string description = 2; string input_schema_digest = 3; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreListToolsRequest { string installation_id = 1; int64 expected_revision = 2; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreListToolsResponse { repeated CoreTool tools = 1; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExecuteToolRequest { string idempotency_key = 1; string installation_id = 2; int64 expected_revision = 3; string tool_name = 4; google.protobuf.Struct input = 5; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExecuteSkillRequest { string idempotency_key = 1; string installation_id = 2; int64 expected_revision = 3; google.protobuf.Struct input = 4; }
// buf:lint:ignore RPC_REQUEST_STANDARD_NAME
message CoreExecuteResponse { string task_id = 1; }

message MCPServiceSearchRequest { CoreExtensionKind kind = 1; CoreExtensionSource source = 2; string text = 3; int32 page_size = 4; string page_token = 5; }
message MCPServiceSearchResponse { repeated CoreExtensionCandidate candidates = 1; string next_page_token = 2; }
message MCPServiceInspectRequest { CoreExtensionKind kind = 1; CoreExtensionSource source = 2; string id = 3; CoreSourcePin pin = 4; }
message MCPServiceInspectResponse { CoreExtensionInspection inspection = 1; }
message MCPServiceRequestInstallRequest { string idempotency_key = 1; string installation_id = 2; int64 expected_revision = 3; CoreExtensionCandidate candidate = 4; CoreExtensionInspection inspection = 5; repeated CoreExtensionSecretInput secret_inputs = 6; }
message MCPServiceRequestInstallResponse { CoreInstallation installation = 1; string confirmation_id = 2; string task_id = 3; }
message MCPServiceRequestUpdateRequest { MCPServiceRequestInstallRequest mutation = 1; }
message MCPServiceRequestUpdateResponse { CoreInstallation installation = 1; string confirmation_id = 2; string task_id = 3; }
message MCPServiceRequestUninstallRequest { string idempotency_key = 1; string installation_id = 2; int64 expected_revision = 3; }
message MCPServiceRequestUninstallResponse { CoreInstallation installation = 1; string confirmation_id = 2; string task_id = 3; }
message MCPServiceListRequest { CoreExtensionKind kind = 1; CoreExtensionSource source = 2; CoreExtensionState state = 3; int32 page_size = 4; string page_token = 5; }
message MCPServiceListResponse { repeated CoreInstallation installations = 1; string next_page_token = 2; }
message MCPServiceGetRequest { string installation_id = 1; }
message MCPServiceGetResponse { CoreInstallation installation = 1; }
message MCPServiceListToolsRequest { string installation_id = 1; int64 expected_revision = 2; }
message MCPServiceListToolsResponse { repeated CoreTool tools = 1; }
message MCPServiceExecuteToolRequest { string idempotency_key = 1; string installation_id = 2; int64 expected_revision = 3; string tool_name = 4; google.protobuf.Struct input = 5; }
message MCPServiceExecuteToolResponse { string task_id = 1; string confirmation_id = 2; }
message SkillServiceSearchRequest { CoreExtensionKind kind = 1; CoreExtensionSource source = 2; string text = 3; int32 page_size = 4; string page_token = 5; }
message SkillServiceSearchResponse { repeated CoreExtensionCandidate candidates = 1; string next_page_token = 2; }
message SkillServiceInspectRequest { CoreExtensionKind kind = 1; CoreExtensionSource source = 2; string id = 3; CoreSourcePin pin = 4; }
message SkillServiceInspectResponse { CoreExtensionInspection inspection = 1; }
message SkillServiceRequestInstallRequest { string idempotency_key = 1; string installation_id = 2; int64 expected_revision = 3; CoreExtensionCandidate candidate = 4; CoreExtensionInspection inspection = 5; repeated CoreExtensionSecretInput secret_inputs = 6; }
message SkillServiceRequestInstallResponse { CoreInstallation installation = 1; string confirmation_id = 2; string task_id = 3; }
message SkillServiceRequestUpdateRequest { SkillServiceRequestInstallRequest mutation = 1; }
message SkillServiceRequestUpdateResponse { CoreInstallation installation = 1; string confirmation_id = 2; string task_id = 3; }
message SkillServiceRequestUninstallRequest { string idempotency_key = 1; string installation_id = 2; int64 expected_revision = 3; }
message SkillServiceRequestUninstallResponse { CoreInstallation installation = 1; string confirmation_id = 2; string task_id = 3; }
message SkillServiceListRequest { CoreExtensionKind kind = 1; CoreExtensionSource source = 2; CoreExtensionState state = 3; int32 page_size = 4; string page_token = 5; }
message SkillServiceListResponse { repeated CoreInstallation installations = 1; string next_page_token = 2; }
message SkillServiceGetRequest { string installation_id = 1; }
message SkillServiceGetResponse { CoreInstallation installation = 1; }
message SkillServiceExecuteRequest { string idempotency_key = 1; string installation_id = 2; int64 expected_revision = 3; google.protobuf.Struct input = 4; }
message SkillServiceExecuteResponse { string task_id = 1; string confirmation_id = 2; }

// buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE RPC_REQUEST_STANDARD_NAME
service MCPService {
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE RPC_REQUEST_STANDARD_NAME
  rpc Search(MCPServiceSearchRequest) returns (MCPServiceSearchResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc Inspect(MCPServiceInspectRequest) returns (MCPServiceInspectResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc RequestInstall(MCPServiceRequestInstallRequest) returns (MCPServiceRequestInstallResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc RequestUpdate(MCPServiceRequestUpdateRequest) returns (MCPServiceRequestUpdateResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc RequestUninstall(MCPServiceRequestUninstallRequest) returns (MCPServiceRequestUninstallResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc List(MCPServiceListRequest) returns (MCPServiceListResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc Get(MCPServiceGetRequest) returns (MCPServiceGetResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc ListTools(MCPServiceListToolsRequest) returns (MCPServiceListToolsResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc ExecuteTool(MCPServiceExecuteToolRequest) returns (MCPServiceExecuteToolResponse);
}
// buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE RPC_REQUEST_STANDARD_NAME
service SkillService {
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc Search(SkillServiceSearchRequest) returns (SkillServiceSearchResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc Inspect(SkillServiceInspectRequest) returns (SkillServiceInspectResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc RequestInstall(SkillServiceRequestInstallRequest) returns (SkillServiceRequestInstallResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc RequestUpdate(SkillServiceRequestUpdateRequest) returns (SkillServiceRequestUpdateResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc RequestUninstall(SkillServiceRequestUninstallRequest) returns (SkillServiceRequestUninstallResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc List(SkillServiceListRequest) returns (SkillServiceListResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc Get(SkillServiceGetRequest) returns (SkillServiceGetResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc Execute(SkillServiceExecuteRequest) returns (SkillServiceExecuteResponse);
}
