syntax = "proto3";

package dirextalk.agent.v1;

option go_package = "github.com/YingSuiAI/dirextalk-agent/api/gen/dirextalk/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "dirextalk/agent/v1/core_task.proto";

message CoreConversation {
  string conversation_id = 1;
  string title = 2;
  int64 revision = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CoreConversationMessage {
  string message_id = 1;
  string conversation_id = 2;
  int64 sequence = 3;
  string role = 4;
  string content = 5;
  string model_profile_id = 6;
  google.protobuf.Struct payload = 7;
  repeated string related_task_ids = 8;
  repeated string tool_summaries = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ConversationServiceCreateRequest {
  string idempotency_key = 1;
  string title = 2;
}
message ConversationServiceCreateResponse { CoreConversation conversation = 1; }
message ConversationServiceGetRequest { string conversation_id = 1; string page_token = 2; int32 page_size = 3; }
message ConversationServiceGetResponse { CoreConversation conversation = 1; repeated CoreConversationMessage messages = 2; string next_page_token = 3; }
message ConversationServiceListRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ConversationServiceListResponse {
  repeated CoreConversation conversations = 1;
  string next_page_token = 2;
}
message ConversationServiceDeleteRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
  int64 expected_revision = 3;
}
message ConversationServiceDeleteResponse {}

message ConversationServiceChatRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
  string message = 3;
  string model_profile_id = 4;
  repeated CoreExtensionSelection extensions = 5;
  repeated string knowledge_refs = 6;
  optional int64 expected_revision = 7;
}
message ConversationServiceChatResponse {
  CoreConversation conversation = 1;
  CoreConversationMessage message = 2;
  repeated string related_task_ids = 3;
}

message ConversationServiceStreamChatRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
  string message = 3;
  string model_profile_id = 4;
  repeated CoreExtensionSelection extensions = 5;
  repeated string knowledge_refs = 6;
  optional int64 expected_revision = 7;
}
message CoreStreamChatDelta { string text = 1; }
message CoreStreamChatToolProgress {
  string name = 1;
  string status = 2;
  repeated string related_task_ids = 3;
  repeated string tool_summaries = 4;
}
message CoreToolResult {
  string tool_name = 1;
  string summary = 2;
  repeated string related_task_ids = 3;
  repeated string tool_summaries = 4;
}
message CoreStreamChatDone {
  CoreConversationMessage message = 1;
  repeated string related_task_ids = 2;
  repeated CoreToolResult tool_results = 3;
}
message ConversationServiceStreamChatResponse {
  oneof event {
    CoreStreamChatDelta delta = 1;
    CoreStreamChatToolProgress tool = 2;
    CoreStreamChatDone done = 3;
  }
}

// A durable model turn is accepted before execution starts.  Events are
// append-only and are resumed using their sequence number.
message CoreConversationTurn {
  string turn_id = 1;
  string request_id = 2;
  string conversation_id = 3;
  string message = 4;
  string model_profile_id = 5;
  int64 expected_revision = 6;
  int64 revision = 7;
  string state = 8;
  string terminal_code = 9;
  string terminal_summary = 10;
  int64 last_sequence = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  CoreConversationMessage result = 14;
}
message ConversationServiceStartTurnRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
  string message = 3;
  string model_profile_id = 4;
  optional int64 expected_revision = 5;
  repeated CoreExtensionSelection extensions = 6;
}
message ConversationServiceStartTurnResponse { CoreConversationTurn turn = 1; }
message ConversationServiceGetTurnRequest { string turn_id = 1; }
message ConversationServiceGetTurnResponse { CoreConversationTurn turn = 1; }
message ConversationServiceWatchTurnEventsRequest {
  string turn_id = 1;
  int64 after_sequence = 2;
  int32 limit = 3;
}
message CoreConversationTurnEvent {
  string turn_id = 1;
  int64 sequence = 2;
  string kind = 3;
  string text = 4;
  CoreConversationMessage message = 5;
  string error_code = 6;
  string error_summary = 7;
  int64 first_sequence = 8;
  int64 last_sequence = 9;
  bool replay_gap = 10;
  google.protobuf.Timestamp created_at = 11;
  string confirmation_id = 12;
  string attempt_id = 13;
  string execution_id = 14;
  string status = 15;
  CoreToolResult tool_result = 16;
}
message ConversationServiceCancelTurnRequest {
  string idempotency_key = 1;
  string turn_id = 2;
  int64 expected_revision = 3;
}
message ConversationServiceCancelTurnResponse { CoreConversationTurn turn = 1; }

message ConversationServiceWatchTurnEventsResponse { CoreConversationTurnEvent event = 1; }

service ConversationService {
  rpc Create(ConversationServiceCreateRequest) returns (ConversationServiceCreateResponse);
  rpc Get(ConversationServiceGetRequest) returns (ConversationServiceGetResponse);
  rpc List(ConversationServiceListRequest) returns (ConversationServiceListResponse);
  rpc Delete(ConversationServiceDeleteRequest) returns (ConversationServiceDeleteResponse);
  rpc Chat(ConversationServiceChatRequest) returns (ConversationServiceChatResponse);
  rpc StreamChat(ConversationServiceStreamChatRequest) returns (stream ConversationServiceStreamChatResponse);
  rpc StartTurn(ConversationServiceStartTurnRequest) returns (ConversationServiceStartTurnResponse);
  rpc GetTurn(ConversationServiceGetTurnRequest) returns (ConversationServiceGetTurnResponse);
  rpc WatchTurnEvents(ConversationServiceWatchTurnEventsRequest) returns (stream ConversationServiceWatchTurnEventsResponse);
  rpc CancelTurn(ConversationServiceCancelTurnRequest) returns (ConversationServiceCancelTurnResponse);
}
