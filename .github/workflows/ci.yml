name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "adam/**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: "123789"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Full test suite
        # PostgreSQL fixtures use a database isolated by process, package, and test name.
        # Bound package concurrency to keep database creation and cleanup stable
        # on both hosted and local runners.
        run: go test -p 2 ./... -count=1
      - name: Upgrade and release contract tests
        run: |
          go test -tags=dendrite_upgrade_tests ./cmd/dendrite-upgrade-tests -count=1
          bash scripts/release/contract_test.sh
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks=SA* ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Focused race tests
        run: go test -race ./internal/dirextalkmcp ./p2p/internal/httpapi ./p2p/internal/agent ./internal/productpolicy -count=1
      - name: Production build
        run: go build ./cmd/dirextalk-message-server
      - name: Compose contract
        run: docker compose -f docker-compose.p2p.yml config >/dev/null
      - name: Diff check
        run: git diff --check
