name: Stable server release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version on main, or exact Agent commit on the integration branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dirextalk-message-server-release
  cancel-in-progress: false

jobs:
  integration-publish:
    name: Publish split Agent integration images
    if: github.ref == 'refs/heads/adam/agent-core-v1-integration'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Validate requested Agent revision
        env:
          AGENT_REVISION_INPUT: ${{ inputs.version }}
        run: |
          case "$AGENT_REVISION_INPUT" in
            *[!0-9a-f]*|'')
              echo 'integration publication requires a lowercase hexadecimal Agent commit' >&2
              exit 1
              ;;
          esac
          test "${#AGENT_REVISION_INPUT}" -eq 40
          remote_revision=$(git ls-remote --exit-code \
            https://github.com/YingSuiAI/dirextalk-agent.git \
            refs/heads/adam/agent-core-v1-integration | awk '{print $1}')
          test "$remote_revision" = "$AGENT_REVISION_INPUT"

      - name: Check out message-server
        uses: actions/checkout@v4
        with:
          path: message-server
          persist-credentials: false

      - name: Check out exact Agent revision
        uses: actions/checkout@v4
        with:
          repository: YingSuiAI/dirextalk-agent
          ref: ${{ inputs.version }}
          path: agent
          persist-credentials: false

      - id: identity
        name: Bind source and image identities
        env:
          EXPECTED_MESSAGE_REVISION: ${{ github.sha }}
          EXPECTED_AGENT_REVISION: ${{ inputs.version }}
        run: |
          message_revision=$(git -C message-server rev-parse HEAD)
          agent_revision=$(git -C agent rev-parse HEAD)
          test "$message_revision" = "$EXPECTED_MESSAGE_REVISION"
          test "$agent_revision" = "$EXPECTED_AGENT_REVISION"
          message_short=$(git -C message-server rev-parse --short=8 HEAD)
          agent_short=$(git -C agent rev-parse --short=8 HEAD)
          message_build_time=$(git -C message-server show -s --format=%cI HEAD)
          agent_build_time=$(git -C agent show -s --format=%cI HEAD)
          {
            echo "message_revision=$message_revision"
            echo "agent_revision=$agent_revision"
            echo "message_tag=agent-core-v1-$message_short"
            echo "agent_tag=agent-core-v1-$agent_short"
            echo "message_build_time=$message_build_time"
            echo "agent_build_time=$agent_build_time"
          } >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: message-image
        name: Build and publish message-server image
        uses: docker/build-push-action@v6
        with:
          context: ./message-server
          file: ./message-server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: docker.io/dirextalk/message-server:${{ steps.identity.outputs.message_tag }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            VERSION=${{ steps.identity.outputs.message_tag }}
            COMMIT=${{ steps.identity.outputs.message_revision }}
            BUILD_TIME=${{ steps.identity.outputs.message_build_time }}

      - id: agent-image
        name: Build and publish unified Agent image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/deploy/container/agent.Containerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: docker.io/dirextalk/agent:${{ steps.identity.outputs.agent_tag }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            VERSION=${{ steps.identity.outputs.agent_tag }}
            REVISION=${{ steps.identity.outputs.agent_revision }}

      - name: Record immutable publication evidence
        env:
          MESSAGE_TAG: ${{ steps.identity.outputs.message_tag }}
          MESSAGE_REVISION: ${{ steps.identity.outputs.message_revision }}
          MESSAGE_DIGEST: ${{ steps.message-image.outputs.digest }}
          AGENT_TAG: ${{ steps.identity.outputs.agent_tag }}
          AGENT_REVISION: ${{ steps.identity.outputs.agent_revision }}
          AGENT_DIGEST: ${{ steps.agent-image.outputs.digest }}
        run: |
          case "$MESSAGE_DIGEST" in sha256:[0-9a-f][0-9a-f]*) ;; *) exit 1 ;; esac
          case "$AGENT_DIGEST" in sha256:[0-9a-f][0-9a-f]*) ;; *) exit 1 ;; esac
          test "${#MESSAGE_DIGEST}" -eq 71
          test "${#AGENT_DIGEST}" -eq 71
          {
            echo '## Split Agent integration publication'
            echo
            echo "- message-server: docker.io/dirextalk/message-server:$MESSAGE_TAG@$MESSAGE_DIGEST"
            echo "- message-server source: $MESSAGE_REVISION"
            echo "- Agent: docker.io/dirextalk/agent:$AGENT_TAG@$AGENT_DIGEST"
            echo "- Agent source: $AGENT_REVISION"
            echo '- platform: linux/amd64'
          } >>"$GITHUB_STEP_SUMMARY"

  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: "123789"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - id: commit
        name: Bind verified commit
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Prepare release
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: bash scripts/release/prepare.sh "$RELEASE_VERSION_INPUT"
      - name: Verify release
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: bash scripts/release/verify.sh "$RELEASE_VERSION_INPUT"

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: "123789"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require the independently verified main commit
        env:
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT"
      - name: Recreate commit-bound local verification evidence
        run: |
          bash scripts/release/prepare.sh "$RELEASE_VERSION_INPUT"
          bash scripts/release/verify.sh "$RELEASE_VERSION_INPUT"
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Configure release tag identity and Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
      - name: Publish version image and Release, then latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: bash scripts/release/publish.sh "$RELEASE_VERSION_INPUT"
