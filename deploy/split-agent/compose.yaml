name: ${DIREXTALK_SPLIT_STACK_NAME:?set a unique fresh split-stack name}

# Production consumes the published application release channels. Third-party
# infrastructure images remain digest-pinned below. Local sibling builds stay
# in compose.local.yaml.

x-message-image: &message-image
  image: ${DIREXTALK_MESSAGE_SERVER_IMAGE:?set the message-server release channel}

x-agent-image: &agent-image
  image: ${DIREXTALK_AGENT_IMAGE:?set the Agent release channel}

x-coturn-image: &coturn-image
  image: ${DIREXTALK_COTURN_IMAGE_IMMUTABLE:?set an immutable coturn image reference}

x-hardened-service: &hardened-service
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=1777

x-postgres-hardening: &postgres-hardening
  read_only: true
  cap_drop: ["ALL"]
  cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=1777
    - /run/postgresql:rw,noexec,nosuid,nodev,mode=2775
    - /run/dirextalk-postgres-secrets:rw,noexec,nosuid,nodev,mode=0700,uid=0,gid=0

x-agent-hardening: &agent-hardening
  <<: *hardened-service
  user: "65532:65532"

# The server keeps UID 0 only for the file-based Compose secrets: the runtime
# entrypoint must read the protected DB DSN and capability keys before exec'ing
# the binary. All writable state is explicitly named-volume/tmpfs data.
x-message-hardening: &message-hardening
  <<: *hardened-service
  # Rootless Docker bind-mounts protected host files with the provisioning
  # user's host UID.  This narrowly permits reading those files while keeping
  # write, execute, and every other ambient capability dropped.
  cap_add: ["DAC_READ_SEARCH"]

x-extension-runner-hardening: &extension-runner-hardening
  <<: *hardened-service
  user: "65531:65531"
  # The runner admits one transient sandbox execution at a time. These outer
  # container limits remain a second fuse around every inner workload cgroup.
  cpus: "2.0"
  mem_limit: 1g
  pids_limit: 256
  # The runner is an outer sandbox constructor: Docker's default seccomp
  # blocks required clone/unshare/mount/chroot operations before the runner can
  # apply its stricter inner workload sandbox. AppArmor remains bound to one
  # repository-installed profile that grants the Ubuntu userns exception.
  security_opt:
    - no-new-privileges:true
    - apparmor=dirextalk-runner-userns
    - seccomp=unconfined

x-core-runner-hardening: &core-runner-hardening
  <<: *hardened-service
  user: "65530:65530"
  security_opt:
    - no-new-privileges:true
    - apparmor=dirextalk-runner-userns
    - seccomp=unconfined

x-postgres-service: &postgres-service
  image: ${DIREXTALK_POSTGRES_IMAGE_IMMUTABLE:?set an immutable PostgreSQL image reference}
  <<: *postgres-hardening
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s

x-socket-init: &socket-init
  image: ${DIREXTALK_UTILITY_IMAGE_IMMUTABLE:?set an immutable utility image reference}
  entrypoint: ["sh"]
  user: "0:0"
  cap_drop: ["ALL"]
  cap_add: ["CHOWN", "FOWNER", "FSETID"]
  security_opt: ["no-new-privileges:true"]
  network_mode: "none"
  restart: "no"

x-runner-storage-init: &runner-storage-init
  image: ${DIREXTALK_UTILITY_IMAGE_IMMUTABLE:?set an immutable utility image reference}
  entrypoint: ["sh"]
  user: "0:0"
  cap_drop: ["ALL"]
  cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
  security_opt: ["no-new-privileges:true"]
  network_mode: "none"
  restart: "no"

x-message-capability-environment: &message-capability-environment
  P2P_PLUGIN_DOCKER_ENABLED: "false"
  P2P_PLUGIN_BACKEND_BASE_URL: http://message-server:8008
  P2P_AGENT_VOICE_CALLBACK_URL: ${DIREXTALK_AGENT_VOICE_CALLBACK_URL:-https://agent:8444}
  P2P_AGENT_VOICE_CALLBACK_AUTH_TOKEN_FILE: /run/capability/agent-voice-relay.token
  P2P_AGENT_VOICE_CALLBACK_CA_FILE: /run/capability/ca-cert.pem
  P2P_AGENT_VOICE_CALLBACK_CLIENT_CERT_FILE: /run/capability/ms-client-cert.pem
  P2P_AGENT_VOICE_CALLBACK_CLIENT_KEY_FILE: /run/capability/ms-client-key.pem
  P2P_AGENT_VOICE_CALLBACK_SERVER_NAME: ${DIREXTALK_AGENT_TLS_SERVER_NAME:-dirextalk-agent}
  P2P_CAPABILITY_GRANT_PRIVATE_KEY_FILE: /run/capability-private/grant-private.key
  P2P_CAPABILITY_GRANT_PUBLIC_KEY_FILE: /run/capability/grant-public.key
  P2P_PRODUCT_CAPABILITY_LISTEN_ADDR: :50053
  P2P_REQUIRE_PRODUCT_CAPABILITY: "true"
  P2P_PRODUCT_CAPABILITY_CA_FILE: /run/capability/ca-cert.pem
  P2P_PRODUCT_CAPABILITY_SERVER_CERT_FILE: /run/capability/ms-server-cert.pem
  P2P_PRODUCT_CAPABILITY_SERVER_KEY_FILE: /run/capability/ms-server-key.pem
  P2P_PRODUCT_CAPABILITY_TOKEN_FILE: /run/capability/agent-to-ms.token
  P2P_PRODUCT_CAPABILITY_PEER_COMMON_NAME: agent-client

services:
  # TURN uses coturn's established shared-secret REST credential mechanism.
  # The protected configuration is generated during provisioning; the secret
  # itself never enters Compose interpolation, the environment, or argv.
  coturn:
    <<: *coturn-image
    user: "0:0"
    command: ["-c", "/run/secrets/turnserver.conf"]
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    # The official Alpine image marks turnserver with file capability
    # cap_net_bind_service; retain it so exec remains valid under
    # no-new-privileges. DAC_READ_SEARCH is required for the root process to
    # read the host-UID-owned 0400 Compose secret.
    cap_add: ["DAC_READ_SEARCH", "NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700
    secrets:
      - source: coturn_config
        target: /run/secrets/turnserver.conf
        mode: 0400
    healthcheck:
      test: ["CMD-SHELL", "grep -Fqx 'listening-port=3478' /run/secrets/turnserver.conf && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  postgres:
    <<: *postgres-service
    entrypoint: ["/usr/local/bin/dirextalk-postgres-entrypoint"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: dirextalk_cluster_admin
      POSTGRES_PASSWORD_FILE: /run/dirextalk-postgres-secrets/postgres_admin_password
      POSTGRES_INIT_SECRET_DIR: /run/dirextalk-postgres-secrets
    secrets:
      - source: postgres_admin_password
        target: postgres_admin_password
      - source: message_postgres_password
        target: message_postgres_password
      - source: agent_postgres_password
        target: agent_postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: postgres_entrypoint
        target: /usr/local/bin/dirextalk-postgres-entrypoint
        mode: 0555
      - source: postgres_initializer
        target: /docker-entrypoint-initdb.d/10-dirextalk-databases.sh
        mode: 0555
    networks:
      message_database:
        aliases: [message-postgres]
      agent_database:
        aliases: [agent-postgres]

  agent-secret-init:
    image: ${DIREXTALK_UTILITY_IMAGE_IMMUTABLE:?set an immutable utility image reference}
    entrypoint: ["/usr/local/bin/materialize-agent-secrets"]
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_READ_SEARCH", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    secrets:
      - source: agent_database_url
        target: database_url
        mode: 0400
      - source: core_secret_master_key
        target: core_secret_master_key
        mode: 0400
    volumes:
      - type: bind
        source: ${DIREXTALK_AGENT_CONFIG_FILE:?set the Agent non-secret config path}
        target: /bootstrap/config.yaml
        read_only: true
      - agent_secret_material:/out
      - agent_config_material:/out-config
      - agent_knowledge_content:/out-data/knowledge-content
      - agent_knowledge_mount:/out-data/knowledge-mount
      - capability_shared_material:/bootstrap/capability:ro
    configs:
      - source: agent_secret_materializer
        target: /usr/local/bin/materialize-agent-secrets
        mode: 0555
    networks: [agent_private]
    depends_on:
      message-server-init:
        condition: service_completed_successfully
    restart: "no"

  agent-migrate:
    <<: [*agent-image, *agent-hardening]
    command: ["migrate"]
    restart: "no"
    volumes:
      - agent_config_material:/etc/dirextalk-agent:ro
      - agent_secret_material:/run/secrets:ro
    networks: [agent_private, agent_database]
    depends_on:
      agent-secret-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  agent:
    <<: [*agent-image, *agent-hardening]
    command: ["serve"]
    restart: unless-stopped
    environment:
      AGENT_HEALTHCHECK_SERVER_NAME: ${DIREXTALK_AGENT_TLS_SERVER_NAME:-dirextalk-agent}
    expose: ["9443", "8444", "8082"]
    volumes:
      - agent_config_material:/etc/dirextalk-agent:ro
      - agent_secret_material:/run/secrets:ro
      - type: volume
        source: agent_extension_socket
        target: ${DIREXTALK_CORE_EXTENSION_RUNNER_DIR:?set the extension runner socket directory}
        volume:
          nocopy: true
      - agent_extension_staging:/var/lib/dirextalk-agent/extension-staging
      - agent_runner_workspaces:/var/lib/dirextalk-agent/extension-workspaces
      - type: volume
        source: core_runner_socket
        target: ${DIREXTALK_CORE_WORKLOAD_RUNNER_DIR:?set the Core Runner socket directory}
        volume:
          nocopy: true
      - agent_knowledge_content:/var/lib/dirextalk-agent/knowledge-content
      - agent_knowledge_mount:/var/lib/dirextalk-agent/knowledge-mount:ro
      - agent_core_data:/var/lib/dirextalk-agent/core-data
      - type: bind
        source: ${DIREXTALK_STATIC_SITES_ROOT:?set the Agent-owned static-site host root}
        target: /var/lib/dirextalk-agent/static-sites
        bind:
          create_host_path: false
    networks: [agent_private, agent_database, agent_caller, agent_egress, message_public]
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
      extension-runner:
        condition: service_healthy
      core-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/dirextalk-agent", "healthcheck", "--expect-instance-id", "${DIREXTALK_AGENT_INSTANCE_ID:?set the Agent instance ID}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Isolated extension executor. It starts with the default three-container
  # Agent runtime. The runner has no network, database, Agent secret, or Docker
  # socket. Its only host bind is a caller-provisioned delegated cgroup-v2
  # subtree.
  extension-runner:
    <<: [*agent-image, *extension-runner-hardening]
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/dirextalk-extension-runner"]
    cgroup: host
    cgroup_parent: ${DIREXTALK_EXTENSION_CGROUP_PARENT:-${DIREXTALK_SPLIT_STACK_NAME:?set a unique split stack name}-extension.slice}
    group_add: ["65532"]
    command:
      - serve
      - --socket
      - ${DIREXTALK_CORE_EXTENSION_RUNNER_SOCKET:?set the extension runner socket path}
      - --agent-uid
      - "65532"
      - --install-root
      - /var/lib/dirextalk-agent/extension-install
      - --prepared-root
      - /var/lib/dirextalk-agent/extension-install/.prepared
      - --node-runtime-root
      - /usr/local/libexec/dirextalk-node-runtime
      - --workspace-root
      - /var/lib/dirextalk-agent/extension-workspaces
      - --cgroup-root
      - /cgroup
      - --state-root
      - /var/lib/dirextalk-agent/extension-state
    volumes:
      - type: volume
        source: agent_extension_socket
        target: ${DIREXTALK_CORE_EXTENSION_RUNNER_DIR:?set the extension runner socket directory}
        volume:
          nocopy: true
      - agent_extension_install:/var/lib/dirextalk-agent/extension-install
      - agent_runner_workspaces:/var/lib/dirextalk-agent/extension-workspaces
      - agent_extension_state:/var/lib/dirextalk-agent/extension-state
      - type: bind
        source: ${DIREXTALK_EXTENSION_CGROUP_ROOT:?set a delegated cgroup-v2 subtree for the extension runner}
        target: /cgroup
        bind:
          create_host_path: false
    network_mode: "none"
    healthcheck:
      test: ["CMD", "/usr/local/bin/dirextalk-extension-runner", "probe", "--socket", "${DIREXTALK_CORE_EXTENSION_RUNNER_SOCKET:?set the extension runner socket path}", "--runner-uid", "65531"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      extension-socket-init:
        condition: service_completed_successfully
      extension-runner-storage-init:
        condition: service_completed_successfully

  extension-socket-init:
    <<: *socket-init
    command:
      - -ec
      - >-
        install -d -m 2750 /socket;
        chown 65531:65532 /socket;
        chmod 2750 /socket;
        test "$$(stat -c '%u:%g:%a' /socket)" = 65531:65532:2750
    volumes:
      - type: volume
        source: agent_extension_socket
        target: /socket
        volume:
          nocopy: true

  # Named-volume roots are initialized explicitly. This avoids Docker's image
  # copy-up ownership and makes the first fresh-state start deterministic.
  extension-runner-storage-init:
    <<: *runner-storage-init
    command:
      - -ec
      - >-
        chown 65531:65531 /install /state;
        chmod 0700 /install /state;
        mkdir -p /install/.prepared;
        chown 65531:65531 /install/.prepared;
        chmod 0700 /install/.prepared;
        chown 65531:65532 /workspace;
        chmod 0770 /workspace;
        test "$$(stat -c '%u:%g:%a' /install)" = 65531:65531:700;
        test "$$(stat -c '%u:%g:%a' /install/.prepared)" = 65531:65531:700;
        test "$$(stat -c '%u:%g:%a' /state)" = 65531:65531:700;
        test "$$(stat -c '%u:%g:%a' /workspace)" = 65531:65532:770
    volumes:
      - agent_extension_install:/install
      - agent_runner_workspaces:/workspace
      - agent_extension_state:/state

  # Isolated local workload provider. It is separate from the Agent process and
  # starts with the default three-container Agent runtime. It has no network,
  # Agent secret, Docker socket, or host filesystem access beyond the
  # delegated cgroup-v2 subtree.
  core-runner:
    <<: [*agent-image, *core-runner-hardening]
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/dirextalk-core-runner"]
    cgroup: host
    cgroup_parent: ${DIREXTALK_CORE_RUNNER_CGROUP_PARENT:-${DIREXTALK_SPLIT_STACK_NAME:?set a unique split stack name}-core-runner.slice}
    group_add: ["65532"]
    command:
      - serve
      - --socket
      - ${DIREXTALK_CORE_WORKLOAD_RUNNER_SOCKET:?set the Core Runner socket path}
      - --agent-uid
      - "65532"
      - --install-root
      - /var/lib/dirextalk-core-runner/installs
      - --workspace-root
      - /var/lib/dirextalk-core-runner/workspaces
      - --cgroup-root
      - /cgroup
      - --static-shell
      - /usr/local/libexec/dirextalk-core-shell
      - --state-root
      - /var/lib/dirextalk-core-runner/state
    volumes:
      - type: volume
        source: core_runner_socket
        target: ${DIREXTALK_CORE_WORKLOAD_RUNNER_DIR:?set the Core Runner socket directory}
        volume:
          nocopy: true
      - core_runner_installs:/var/lib/dirextalk-core-runner/installs
      - core_runner_workspaces:/var/lib/dirextalk-core-runner/workspaces
      - core_runner_state:/var/lib/dirextalk-core-runner/state
      - type: bind
        source: ${DIREXTALK_CORE_RUNNER_CGROUP_ROOT:?set a delegated cgroup-v2 subtree for Core Runner}
        target: /cgroup
        bind:
          create_host_path: false
    network_mode: "none"
    healthcheck:
      test: ["CMD", "/usr/local/bin/dirextalk-core-runner", "probe", "--socket", "${DIREXTALK_CORE_WORKLOAD_RUNNER_SOCKET:?set the Core Runner socket path}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      core-runner-socket-init:
        condition: service_completed_successfully
      core-runner-storage-init:
        condition: service_completed_successfully

  core-runner-socket-init:
    <<: *socket-init
    command:
      - -ec
      - >-
        install -d -m 2750 /socket;
        chown 65530:65532 /socket;
        chmod 2750 /socket;
        test "$$(stat -c '%u:%g:%a' /socket)" = 65530:65532:2750
    volumes:
      - type: volume
        source: core_runner_socket
        target: /socket
        volume:
          nocopy: true

  core-runner-storage-init:
    <<: *runner-storage-init
    command:
      - -ec
      - >-
        chown 65530:65530 /install /workspace /state;
        chmod 0700 /install /workspace /state;
        test "$$(stat -c '%u:%g:%a' /install)" = 65530:65530:700;
        test "$$(stat -c '%u:%g:%a' /workspace)" = 65530:65530:700;
        test "$$(stat -c '%u:%g:%a' /state)" = 65530:65530:700
    volumes:
      - core_runner_installs:/install
      - core_runner_workspaces:/workspace
      - core_runner_state:/state

  message-server-init:
    <<: *message-image
    restart: "no"
    entrypoint: ["/usr/local/bin/initialize-message-server"]
    environment:
      MESSAGE_SERVER_NAME: ${DIREXTALK_MESSAGE_SERVER_NAME:-localhost}
      MESSAGE_CLIENT_BASE_URL: ${DIREXTALK_MESSAGE_CLIENT_BASE_URL:?set DIREXTALK_MESSAGE_CLIENT_BASE_URL in the protected stack .env}
      MESSAGE_SERVER_TLS_MODE: ${DIREXTALK_MESSAGE_TLS_MODE:?set DIREXTALK_MESSAGE_TLS_MODE in the protected stack .env}
      MESSAGE_DEPLOYMENT_MODE: ${DIREXTALK_SPLIT_COMPOSE_MODE:?set DIREXTALK_SPLIT_COMPOSE_MODE in the protected stack .env}
      MESSAGE_LOCAL_BOOTSTRAP_ENABLED: ${DIREXTALK_LOCAL_BOOTSTRAP_ENABLED:-false}
    secrets:
      - source: message_registration_shared_secret
        target: /run/secrets/message_registration_shared_secret
        mode: 0400
      - source: turn_shared_secret
        target: /run/secrets/turn_shared_secret
        mode: 0400
    volumes:
      - message_server_config:/etc/dirextalk-message-server
      - message_server_data:/var/dirextalk-message-server
      - capability_authority_material:/var/lib/dirextalk-message-server/capability-authority
      - capability_shared_material:/var/lib/dirextalk-message-server/capability
      - capability_private_material:/var/lib/dirextalk-message-server/capability-private
      - type: bind
        source: ${DIREXTALK_MESSAGE_TLS_CERT_FILE:?set the message-server TLS certificate file}
        target: /bootstrap/external/server.crt
        read_only: true
      - type: bind
        source: ${DIREXTALK_MESSAGE_TLS_KEY_FILE:?set the message-server TLS private key file}
        target: /bootstrap/external/server.key
        read_only: true
    networks: [message_private, message_database]
    configs:
      - source: message_server_initializer
        target: /usr/local/bin/initialize-message-server
        mode: 0555
      - source: capability_ca_initializer
        target: /usr/local/bin/initialize-capability-ca
        mode: 0555
    depends_on:
      postgres:
        condition: service_healthy

  message-server:
    <<: [*message-image, *message-hardening]
    # Docker healthchecks run as descendants of the application process.  The
    # BusyBox HTTPS probe may leave its ssl_client child orphaned when the
    # health timeout interrupts a handshake; a real init reaps those adopted
    # children so repeated probes cannot exhaust the container PID limit.
    init: true
    restart: unless-stopped
    environment:
      <<: *message-capability-environment
      MESSAGE_SERVER_TLS_MODE: ${DIREXTALK_MESSAGE_TLS_MODE:?set DIREXTALK_MESSAGE_TLS_MODE in the protected stack .env}
      P2P_PORTAL_CREDENTIALS_FILE: /var/dirextalk-message-server/p2p/bootstrap.json
      P2P_PORTAL_PASSWORD_FILE: /run/secrets/message_portal_password
      P2P_MESSAGE_SERVER_INSTANCE_ID: ${DIREXTALK_MESSAGE_SERVER_INSTANCE_ID:?set the message-server instance ID}
      P2P_AGENT_INSTANCE_ID: ${DIREXTALK_AGENT_INSTANCE_ID:?set the Agent instance ID}
      P2P_ACCOUNT_GENERATION: ${DIREXTALK_ACCOUNT_GENERATION:?set the fresh account generation}
      DIREXTALK_RELEASE_CATALOG_ORIGIN: ${DIREXTALK_RELEASE_CATALOG_ORIGIN:?set the HTTPS release catalog origin}
    entrypoint: ["/usr/local/bin/message-server-entrypoint"]
    command:
      - --http-bind-address
      - :8008
    ports:
      - "127.0.0.1:${DIREXTALK_MESSAGE_HTTP_BIND:?set DIREXTALK_MESSAGE_HTTP_BIND in the protected stack .env}:8008"
    expose: ["50053"]
    volumes:
      - message_server_config:/etc/dirextalk-message-server:ro
      - message_server_data:/var/dirextalk-message-server
      - message_plugins_data:/var/dirextalk-message-server/plugins
      - capability_shared_material:/run/capability:ro
      - capability_private_material:/run/capability-private:ro
    configs:
      - source: message_server_entrypoint
        target: /usr/local/bin/message-server-entrypoint
        mode: 0555
    secrets:
      - source: message_database_url
        target: /run/secrets/message_database_url
        mode: 0400
      - source: message_portal_password
        target: /run/secrets/message_portal_password
        mode: 0400
    networks: [message_private, message_database, agent_caller, message_public]
    depends_on:
      coturn:
        condition: service_healthy
      postgres:
        condition: service_healthy
      message-server-init:
        condition: service_completed_successfully
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "-", "http://127.0.0.1:8008/_p2p/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

networks:
  message_private:
    name: ${DIREXTALK_MESSAGE_PRIVATE_NETWORK:?set a fresh message private network name}
    internal: true
  message_public:
    # Rootless Docker's published-port forwarding requires the service to be
    # attached to one non-internal bridge. Caddy reaches message-server and
    # the Agent HTTP data plane only through this shared edge; no container
    # publishes the Agent port on the host.
    name: ${DIREXTALK_MESSAGE_PUBLIC_NETWORK:?set a fresh message public network name}
    internal: false
  message_database:
    name: ${DIREXTALK_MESSAGE_DATABASE_NETWORK:?set a fresh message database network name}
    internal: true
  agent_private:
    name: ${DIREXTALK_AGENT_PRIVATE_NETWORK:?set a fresh Agent private network name}
    internal: true
  agent_database:
    name: ${DIREXTALK_AGENT_DATABASE_NETWORK:?set a fresh Agent database network name}
    internal: true
  agent_caller:
    name: ${DIREXTALK_AGENT_CALLER_NETWORK:?set a fresh Agent caller network name}
    internal: true
  agent_egress:
    name: ${DIREXTALK_AGENT_EGRESS_NETWORK:?set a fresh Agent egress network name}

volumes:
  postgres_data:
    name: ${DIREXTALK_POSTGRES_VOLUME:?set a fresh shared PostgreSQL volume name}
  message_server_config:
    name: ${DIREXTALK_MESSAGE_CONFIG_VOLUME:?set a fresh message config volume name}
  message_server_data:
    name: ${DIREXTALK_MESSAGE_DATA_VOLUME:?set a fresh message data volume name}
  message_plugins_data:
    name: ${DIREXTALK_MESSAGE_PLUGINS_VOLUME:?set a fresh message plugins volume name}
  agent_secret_material:
    name: ${DIREXTALK_AGENT_SECRET_VOLUME:?set a fresh Agent secret volume name}
  agent_config_material:
    name: ${DIREXTALK_AGENT_CONFIG_VOLUME:?set a fresh Agent config volume name}
  agent_core_data:
    name: ${DIREXTALK_AGENT_CORE_DATA_VOLUME:?set a fresh Agent data volume name}
  agent_extension_socket:
    name: ${DIREXTALK_AGENT_SOCKET_VOLUME:?set a fresh extension socket volume name}
  agent_extension_install:
    name: ${DIREXTALK_AGENT_INSTALL_VOLUME:?set a fresh extension install volume name}
  agent_extension_staging:
    name: ${DIREXTALK_AGENT_STAGING_VOLUME:?set a fresh extension staging volume name}
  agent_runner_workspaces:
    name: ${DIREXTALK_AGENT_RUNNER_WORKSPACE_VOLUME:?set a fresh extension runner workspace volume name}
  agent_extension_state:
    name: ${DIREXTALK_AGENT_RUNNER_STATE_VOLUME:?set a fresh extension runner state volume name}
  agent_knowledge_content:
    name: ${DIREXTALK_AGENT_KNOWLEDGE_CONTENT_VOLUME:?set a fresh Knowledge content volume name}
  agent_knowledge_mount:
    name: ${DIREXTALK_AGENT_KNOWLEDGE_MOUNT_VOLUME:?set a fresh Knowledge mount volume name}
  capability_authority_material:
    name: ${DIREXTALK_CAPABILITY_AUTHORITY_VOLUME:?set a fresh Capability authority volume name}
  capability_shared_material:
    name: ${DIREXTALK_CAPABILITY_SHARED_VOLUME:?set a fresh Capability shared material volume name}
  capability_private_material:
    name: ${DIREXTALK_CAPABILITY_PRIVATE_VOLUME:?set a fresh Capability private material volume name}
  core_runner_socket:
    name: ${DIREXTALK_CORE_RUNNER_SOCKET_VOLUME:?set a fresh Core Runner socket volume name}
  core_runner_installs:
    name: ${DIREXTALK_CORE_RUNNER_INSTALL_VOLUME:?set a fresh Core Runner install volume name}
  core_runner_workspaces:
    name: ${DIREXTALK_CORE_RUNNER_WORKSPACE_VOLUME:?set a fresh Core Runner workspace volume name}
  core_runner_state:
    name: ${DIREXTALK_CORE_RUNNER_STATE_VOLUME:?set a fresh Core Runner state volume name}

configs:
  message_server_initializer:
    file: ${DIREXTALK_MESSAGE_SERVER_INITIALIZER_FILE:?set the message-server initializer helper file}
  agent_secret_materializer:
    file: ${DIREXTALK_AGENT_SECRET_MATERIALIZER_FILE:?set the Agent secret materializer helper file}
  message_server_entrypoint:
    file: ${DIREXTALK_MESSAGE_SERVER_ENTRYPOINT_FILE:?set the message-server entrypoint helper file}
  capability_ca_initializer:
    file: ${DIREXTALK_CAPABILITY_CA_INITIALIZER_FILE:?set the Capability CA initializer helper file}
  postgres_entrypoint:
    file: ${DIREXTALK_POSTGRES_ENTRYPOINT_FILE:?set the PostgreSQL secret materializer entrypoint file}
  postgres_initializer:
    file: ${DIREXTALK_POSTGRES_INITIALIZER_FILE:?set the PostgreSQL initializer helper file}

secrets:
  coturn_config:
    file: ${DIREXTALK_COTURN_CONFIG_FILE:?set the protected coturn configuration file}
  turn_shared_secret:
    file: ${DIREXTALK_TURN_SHARED_SECRET_FILE:?set the protected TURN shared secret file}
  postgres_admin_password:
    file: ${DIREXTALK_POSTGRES_ADMIN_PASSWORD_FILE:?set the protected PostgreSQL cluster-admin password file}
  message_postgres_password:
    file: ${DIREXTALK_MESSAGE_POSTGRES_PASSWORD_FILE:?set the message PostgreSQL password file}
  agent_postgres_password:
    file: ${DIREXTALK_AGENT_POSTGRES_PASSWORD_FILE:?set the Agent PostgreSQL password file}
  message_database_url:
    file: ${DIREXTALK_MESSAGE_DATABASE_URL_FILE:?set the message database URL file}
  message_registration_shared_secret:
    file: ${DIREXTALK_MESSAGE_REGISTRATION_SHARED_SECRET_FILE:?set the local bootstrap shared secret file}
  message_portal_password:
    file: ${DIREXTALK_MESSAGE_PORTAL_PASSWORD_FILE:?set the protected message portal password file}
  agent_database_url:
    file: ${DIREXTALK_AGENT_DATABASE_URL_FILE:?set the Agent database URL file}
  core_secret_master_key:
    file: ${DIREXTALK_CORE_SECRET_MASTER_KEY_FILE:?set the Agent 32-byte at-rest master key file}
