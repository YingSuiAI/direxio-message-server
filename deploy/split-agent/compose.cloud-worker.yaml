# Opt-in s2 Agent private listeners. The deployer-owned edge reaches these
# exact s2 private-address upstreams over the proved peering route. Neither
# listener owns public :443 and both terminate their own TLS identities.

services:
  agent:
    expose:
      - "10443"
      - "11443"
    ports:
      - "${DIREXTALK_CLOUD_WORKER_AGENT_BIND_IP:?set the proved s2 private bind IP}:10443:10443"
      - "${DIREXTALK_CLOUD_WORKER_AGENT_BIND_IP:?set the proved s2 private bind IP}:11443:11443"
    volumes:
      - type: bind
        source: ${DIREXTALK_CLOUD_WORKER_CONTROL_TLS_CERT_FILE:?set the WorkerControl TLS certificate file}
        target: /run/cloud-worker/worker-control-cert.pem
        read_only: true
      - type: bind
        source: ${DIREXTALK_CLOUD_WORKER_CONTROL_TLS_KEY_FILE:?set the WorkerControl TLS key file}
        target: /run/cloud-worker/worker-control-key.pem
        read_only: true
      - type: bind
        source: ${DIREXTALK_CLOUD_WORKER_MODEL_RELAY_TLS_CERT_FILE:?set the Model Relay TLS certificate file}
        target: /run/cloud-worker/model-relay-cert.pem
        read_only: true
      - type: bind
        source: ${DIREXTALK_CLOUD_WORKER_MODEL_RELAY_TLS_KEY_FILE:?set the Model Relay TLS key file}
        target: /run/cloud-worker/model-relay-key.pem
        read_only: true
      - type: bind
        source: ${DIREXTALK_CLOUD_WORKER_IID_CERTIFICATE_FILE:?set the AWS IID trust certificate file}
        target: /run/cloud-worker/aws-iid-cert.pem
        read_only: true
      - type: bind
        source: ${DIREXTALK_CLOUD_WORKER_PRICING_CATALOG_FILE:?set the pinned pricing catalog file}
        target: /run/cloud-worker/pricing-catalog.json
        read_only: true
      - type: bind
        source: ${DIREXTALK_CLOUD_WORKER_RUNTIME_QUALIFICATION_FILE:?set the runtime qualification file}
        target: /run/cloud-worker/runtime-qualification.json
        read_only: true
