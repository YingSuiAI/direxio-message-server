# Explicit direct-TLS listener overlay. The canonical production edge path
# omits this file and terminates public TLS only in Caddy.
services:
  message-server:
    command:
      - --http-bind-address
      - :8008
      - --https-bind-address
      - :8448
      - --tls-cert
      - /etc/dirextalk-message-server/server.crt
      - --tls-key
      - /etc/dirextalk-message-server/server.key
    ports:
      - "127.0.0.1:${DIREXTALK_MESSAGE_HTTPS_BIND:?set DIREXTALK_MESSAGE_HTTPS_BIND in the protected stack .env}:8448"
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q -O - http://127.0.0.1:8008/_p2p/health >/dev/null && wget -Y off --no-check-certificate -q -O - https://127.0.0.1:8448/_p2p/health >/dev/null"]
