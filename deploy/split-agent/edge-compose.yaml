name: ${DIREXTALK_EDGE_STACK_NAME:?set a unique edge stack name}

# The edge is deliberately a separate Compose project from the fresh
# message/Agent stack.  It may reuse only the explicitly named, pre-created
# public network and Caddy state volumes; it never owns the application
# database or the application Compose project.
x-caddy-image: &caddy-image
  image: ${DIREXTALK_CADDY_IMAGE_IMMUTABLE:?set an immutable Caddy image reference}

x-caddy-hardening: &caddy-hardening
  read_only: true
  cap_drop: ["ALL"]
  cap_add: ["NET_BIND_SERVICE"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=1777
    - /run:rw,noexec,nosuid,nodev,mode=0755

services:
  caddy:
    <<: [*caddy-image, *caddy-hardening]
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      DIREXTALK_PUBLIC_DOMAIN: ${DIREXTALK_PUBLIC_DOMAIN:?set the reviewed public domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
      - type: bind
        source: ${DIREXTALK_CADDYFILE:?set the reviewed Caddyfile path}
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${DIREXTALK_STATIC_SITES_ROOT:?set the Agent-owned static-site host root}/public
        target: /srv/dirextalk-sites
        read_only: true
    networks:
      - message_public
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q -O - http://127.0.0.1:2019/config/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  message_public:
    name: ${DIREXTALK_MESSAGE_PUBLIC_NETWORK:?set the existing message public network name}
    external: true

volumes:
  caddy_data:
    name: ${DIREXTALK_CADDY_DATA_VOLUME:?set the existing Caddy data volume name}
    external: true
  caddy_config:
    name: ${DIREXTALK_CADDY_CONFIG_VOLUME:?set the existing Caddy config volume name}
    external: true
