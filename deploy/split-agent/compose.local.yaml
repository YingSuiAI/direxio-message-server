# Local sibling-build override. Each repository owns its build context and
# Dockerfiles; the production topology and secret mounts remain unchanged.
services:
  agent:
    build:
      context: ${DIREXTALK_AGENT_BUILD_CONTEXT:?set the sibling dirextalk-agent source path}
      dockerfile: deploy/container/agent.Containerfile
      args:
        VERSION: ${DIREXTALK_AGENT_BUILD_VERSION:-local}
        REVISION: ${DIREXTALK_AGENT_BUILD_REVISION:-working-tree}
    image: ${DIREXTALK_AGENT_IMAGE_LOCAL:-dirextalk-agent:split-local}

  agent-migrate:
    build:
      context: ${DIREXTALK_AGENT_BUILD_CONTEXT:?set the sibling dirextalk-agent source path}
      dockerfile: deploy/container/agent.Containerfile
      args:
        VERSION: ${DIREXTALK_AGENT_BUILD_VERSION:-local}
        REVISION: ${DIREXTALK_AGENT_BUILD_REVISION:-working-tree}
    image: ${DIREXTALK_AGENT_IMAGE_LOCAL:-dirextalk-agent:split-local}

  # Runner images are owned by the Agent repository. They remain profile-gated
  # and are not built or started by the baseline stack.
  extension-runner:
    build:
      context: ${DIREXTALK_AGENT_BUILD_CONTEXT:?set the sibling dirextalk-agent source path}
      dockerfile: deploy/container/extension-runner.Containerfile
      args:
        VERSION: ${DIREXTALK_AGENT_BUILD_VERSION:-local}
        REVISION: ${DIREXTALK_AGENT_BUILD_REVISION:-working-tree}
    image: ${DIREXTALK_EXTENSION_RUNNER_IMAGE_LOCAL:-dirextalk-extension-runner:split-local}

  core-runner:
    build:
      context: ${DIREXTALK_AGENT_BUILD_CONTEXT:?set the sibling dirextalk-agent source path}
      dockerfile: deploy/container/core-runner.Containerfile
    image: ${DIREXTALK_CORE_RUNNER_IMAGE_LOCAL:-dirextalk-core-runner:split-local}

  message-server:
    build:
      context: ${DIREXTALK_MESSAGE_BUILD_CONTEXT:?set the sibling message-server source path}
      dockerfile: deploy/split-agent/container/message.local.Containerfile
      args:
        VERSION: ${DIREXTALK_MESSAGE_BUILD_VERSION:-local}
        COMMIT: ${DIREXTALK_MESSAGE_BUILD_REVISION:-working-tree}
    image: ${DIREXTALK_MESSAGE_SERVER_IMAGE_LOCAL:-dirextalk-message-server:split-local}
    environment:
      # The local sibling stack has no host updater daemon. Account deletion
      # remains monotonic and is fenced durably in both databases; production
      # compose does not inherit this explicit standalone-only opt-in.
      P2P_ALLOW_ACCOUNT_DELETE_WITHOUT_UPDATER: "true"

  message-server-init:
    build:
      context: ${DIREXTALK_MESSAGE_BUILD_CONTEXT:?set the sibling message-server source path}
      dockerfile: deploy/split-agent/container/message.local.Containerfile
      args:
        VERSION: ${DIREXTALK_MESSAGE_BUILD_VERSION:-local}
        COMMIT: ${DIREXTALK_MESSAGE_BUILD_REVISION:-working-tree}
    image: ${DIREXTALK_MESSAGE_SERVER_IMAGE_LOCAL:-dirextalk-message-server:split-local}
