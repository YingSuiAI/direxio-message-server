# Local sibling-build override. It never changes the private-network topology
# or the secret mounts from compose.yaml; it only builds the message-server,
# Agent Core, and optional isolated runner images from sibling repositories.
services:
  agent:
    build:
      context: ${DIREXTALK_AGENT_BUILD_CONTEXT:?set the sibling dirextalk-agent source path}
      dockerfile: ${DIREXTALK_SPLIT_DEPLOY_DIR:?set the split deployment directory}/container/agent.local.Containerfile
      additional_contexts:
        capability_api: ${DIREXTALK_CAPABILITY_API_BUILD_CONTEXT:?set the sibling capability-api source path}
      args:
        VERSION: ${DIREXTALK_AGENT_BUILD_VERSION:-local}
        REVISION: ${DIREXTALK_AGENT_BUILD_REVISION:-working-tree}
    image: ${DIREXTALK_AGENT_IMAGE_LOCAL:-dirextalk-agent:split-local}

  agent-migrate:
    build:
      context: ${DIREXTALK_AGENT_BUILD_CONTEXT:?set the sibling dirextalk-agent source path}
      dockerfile: ${DIREXTALK_SPLIT_DEPLOY_DIR:?set the split deployment directory}/container/agent.local.Containerfile
      additional_contexts:
        capability_api: ${DIREXTALK_CAPABILITY_API_BUILD_CONTEXT:?set the sibling capability-api source path}
      args:
        VERSION: ${DIREXTALK_AGENT_BUILD_VERSION:-local}
        REVISION: ${DIREXTALK_AGENT_BUILD_REVISION:-working-tree}
    image: ${DIREXTALK_AGENT_IMAGE_LOCAL:-dirextalk-agent:split-local}

  # These local runner images intentionally use the pinned Go 1.26.5
  # toolchain in the sibling-build Dockerfiles. They are profile-gated in the
  # production shape and are not built or started by the baseline stack.
  extension-runner:
    build:
      context: ${DIREXTALK_AGENT_BUILD_CONTEXT:?set the sibling dirextalk-agent source path}
      dockerfile: ${DIREXTALK_SPLIT_DEPLOY_DIR:?set the split deployment directory}/container/extension-runner.local.Containerfile
      additional_contexts:
        capability_api: ${DIREXTALK_CAPABILITY_API_BUILD_CONTEXT:?set the sibling capability-api source path}
      args:
        VERSION: ${DIREXTALK_AGENT_BUILD_VERSION:-local}
        REVISION: ${DIREXTALK_AGENT_BUILD_REVISION:-working-tree}
    image: ${DIREXTALK_EXTENSION_RUNNER_IMAGE_LOCAL:-dirextalk-extension-runner:split-local}

  core-runner:
    build:
      context: ${DIREXTALK_AGENT_BUILD_CONTEXT:?set the sibling dirextalk-agent source path}
      dockerfile: ${DIREXTALK_SPLIT_DEPLOY_DIR:?set the split deployment directory}/container/core-runner.local.Containerfile
      additional_contexts:
        capability_api: ${DIREXTALK_CAPABILITY_API_BUILD_CONTEXT:?set the sibling capability-api source path}
      args:
        VERSION: ${DIREXTALK_AGENT_BUILD_VERSION:-local}
        REVISION: ${DIREXTALK_AGENT_BUILD_REVISION:-working-tree}
    image: ${DIREXTALK_CORE_RUNNER_IMAGE_LOCAL:-dirextalk-core-runner:split-local}

  message-server:
    build:
      context: ${DIREXTALK_MESSAGE_BUILD_CONTEXT:?set the sibling message-server source path}
      dockerfile: ${DIREXTALK_SPLIT_DEPLOY_DIR:?set the split deployment directory}/container/message.local.Containerfile
      additional_contexts:
        capability_api: ${DIREXTALK_CAPABILITY_API_BUILD_CONTEXT:?set the sibling capability-api source path}
      args:
        VERSION: ${DIREXTALK_MESSAGE_BUILD_VERSION:-local}
        COMMIT: ${DIREXTALK_MESSAGE_BUILD_REVISION:-working-tree}
    image: ${DIREXTALK_MESSAGE_SERVER_IMAGE_LOCAL:-dirextalk-message-server:split-local}
    environment:
      # The local sibling stack has no host updater daemon. Account deletion
      # remains monotonic and is fenced durably in both databases; production
      # compose does not inherit this explicit standalone-only opt-in.
      P2P_ALLOW_ACCOUNT_DELETE_WITHOUT_UPDATER: "true"

  message-server-init:
    build:
      context: ${DIREXTALK_MESSAGE_BUILD_CONTEXT:?set the sibling message-server source path}
      dockerfile: ${DIREXTALK_SPLIT_DEPLOY_DIR:?set the split deployment directory}/container/message.local.Containerfile
      additional_contexts:
        capability_api: ${DIREXTALK_CAPABILITY_API_BUILD_CONTEXT:?set the sibling capability-api source path}
      args:
        VERSION: ${DIREXTALK_MESSAGE_BUILD_VERSION:-local}
        COMMIT: ${DIREXTALK_MESSAGE_BUILD_REVISION:-working-tree}
    image: ${DIREXTALK_MESSAGE_SERVER_IMAGE_LOCAL:-dirextalk-message-server:split-local}
